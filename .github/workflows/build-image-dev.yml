# axiora-pulse-be/.github/workflows/build-image-dev.yml
#
# M1: On every push to develop, build the backend image once and push it to ECR
# as  sha-<gitsha>  plus the moving  qa  tag.
#
# This runs ALONGSIDE the existing deploy-dev.yml (which still builds on the QA
# box). It changes nothing about how QA is deployed today — it only publishes an
# immutable artifact to ECR so later milestones can deploy/promote it.
#
# Rollback for this milestone: delete this file and ci-build-push.yml. The
# existing deploy path is untouched.

name: Build image (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: build-image-be-dev
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci-build-push.yml
    permissions:
      id-token: write
      contents: read
    with:
      image_name: axiora-pulse-be
      extra_tags: qa
